name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: medimatrix_test }
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U test -d medimatrix_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_USE_SERVICE: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: cp .env.test .env
      - run: npm ci
      - run: npm run db:generate
      - run: npm run check:config
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:validate
      - run: npm run db:deploy
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run docs:api
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with: { name: openapi, path: docs/api/openapi.json }
