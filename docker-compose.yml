services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medimatrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medimatrix}
      POSTGRES_DB: ${POSTGRES_DB:-medimatrix}
    ports: ['127.0.0.1:${POSTGRES_PORT:-5432}:5432']
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: [minio_data:/data]
  createbuckets:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    environment:
      ACCESS_KEY: ${S3_ACCESS_KEY_ID:-minioadmin}
      SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      BUCKET: ${S3_BUCKET:-medimatrix-documents}
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'until mc alias set local http://minio:9000 "$$ACCESS_KEY" "$$SECRET_KEY"; do sleep 2; done; mc mb --ignore-existing local/$$BUCKET && mc anonymous set none local/$$BUCKET',
      ]
  mailpit:
    image: axllent/mailpit:v1.23
    ports: ['127.0.0.1:8025:8025', '127.0.0.1:1025:1025']
  migrate:
    build: { context: ., target: migrate }
    profiles: [app]
    env_file: .env
    environment: { POSTGRES_HOST: postgres, POSTGRES_PORT: 5432 }
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build: { context: ., target: runner }
    profiles: [app]
    env_file: .env
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SMTP_HOST: mailpit
      S3_ENDPOINT: http://minio:9000
    ports: ['4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      createbuckets: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
volumes:
  postgres_data:
  minio_data:
